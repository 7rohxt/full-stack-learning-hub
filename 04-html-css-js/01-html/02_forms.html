<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <h2>Registration Form</h2>

    <form>

        <div>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Rohit">
        </div>

        <br>

        <div>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Karthick">
        </div>

        <br>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>

        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="roh007@gmail.com">
        </div>

        <br>

        <div>
            <label for="phone">Phone #:</label>
            <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
        </div>

        <br>

        <div>
            <label for="bdate">Birthdate:</label>
            <input type="date" id="bdate" name="bdate">
        </div>

        <br>

        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <br>

        <div>
            <label>Title:</label>

            <input type="radio" id="mr" name="title" value="Mr">
            <label for="mr">Mr.</label>

            <input type="radio" id="mrs" name="title" value="Mrs">
            <label for="mrs">Mrs.</label>

            <input type="radio" id="phd" name="title" value="PhD">
            <label for="phd">PhD.</label>
        </div>

        <br>

        <div>
            <label for="payment">Payment:</label>

            <select id="payment" name="payment">
                <option>Visa</option>
                <option>MasterCard</option>
                <option>RuPay</option>
                <option>UPI</option>
            </select>
        </div>

        <br>

        <div>
            <label for="subscribe">Subscribe:</label>
            <input type="checkbox" id="subscribe" name="subscribe" checked>
        </div>

        <br>

        <div>
            <input type="reset">
            <input type="submit">
        </div>

    </form>

</body>

</html>
